<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>tastyboardgameclub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 🔹 네이버 지도 API (지도용 ncpKeyId) -->
  <script type="text/javascript"
    src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=1t22lstxev&submodules=geocoder"></script>

  <!-- 🔹 Firebase v8 CDN (app + firestore) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: #0b0b0f;
      color: #f8f8ff;
    }

    header {
      padding: 12px 16px;
      background: #15151b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 18px;
    }

    header span {
      font-size: 11px;
      opacity: 0.7;
    }

    main {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 52px);
    }

    /* 지도 자리 */
    #map {
      flex: 1;
      min-height: 260px;
      background: radial-gradient(circle at top, #272738 0, #050509 55%);
    }

    .right-panel {
      max-height: 50vh;
      background: rgba(0, 0, 0, 0.9);
      padding: 8px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    .chip {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      color: #e9ecff;
      /* 글자 또렷하게 */
      opacity: 1;
      /* 더 이상 흐리게 X */
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.12s ease,
        box-shadow 0.12s ease;
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    /* 기본 active 상태 – 공통 느낌 */
    .chip.active {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.7);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }


    /* 🔵 카테고리별 색상 (칩) */
    .chip[data-category="kimchi"].active {
      background: #ff6b6b;
      border-color: #ff6b6b;
    }

    .chip[data-category="brunch"].active {
      background: #f4b400;
      border-color: #f4b400;
    }

    .chip[data-category="gukbap"].active {
      background: #c28b4e;
      border-color: #c28b4e;
    }

    .chip[data-category="michelin"].active {
      background: #ffd700;
      border-color: #ffd700;
      color: #3b2c00;
    }

    .chip[data-category="cafe"].active {
      background: #4caf50;
      border-color: #4caf50;
    }

    .chip[data-category="korean"].active {
      background: #ff8a3d;
      /* 한식 – 따뜻한 오렌지 */
      border-color: #ff8a3d;
    }

    .chip[data-category="chinese"].active {
      background: #e53935;
      /* 중식 – 진한 레드 */
      border-color: #e53935;
    }

    .chip[data-category="japanese"].active {
      background: #ff7eb3;
      /* 일식 – 부드러운 핑크 */
      border-color: #ff7eb3;
    }

    .chip[data-category="western"].active {
      background: #42a5f5;
      /* 양식 – 파란 계열 */
      border-color: #42a5f5;
    }

    .chip[data-category="snacks"].active {
      background: #ff9800;
      /* 분식 – 간식 느낌 오렌지 */
      border-color: #ff9800;
    }

    .chip[data-category="etc"].active {
      background: #9e9e9e;
      /* 기타 – 중립적인 회색 */
      border-color: #9e9e9e;
    }

    .place-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .place-item {
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-left: 3px solid rgba(255, 255, 255, 0.09);
      background: rgba(0, 0, 0, 0.25);
    }

    .place-item.active-place {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .place-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .place-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .place-name {
      font-size: 14px;
      font-weight: 600;
    }

    .place-menu {
      font-size: 11px;
      opacity: 0.75;
    }

    .place-rating {
      font-size: 12px;
      white-space: nowrap;
    }

    .flavor-detail {
      font-size: 11px;
      color: #ffb3b3;
    }


    .place-tags {
      font-size: 11px;
      opacity: 0.85;
    }

    .place-memo {
      font-size: 11px;
      opacity: 0.9;
      line-height: 1.35;
    }

    .place-actions {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      justify-content: flex-end;
    }

    .place-actions button {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      color: #f8f8ff;
      cursor: pointer;
    }

    .place-actions button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-delete {
      border-color: #ff5d5d;
      color: #ffb3b3;
    }

    .btn-route {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid rgba(120, 220, 255, 0.6);
      background: rgba(0, 180, 255, 0.12);
      color: #cfeeff;
      cursor: pointer;
      margin-left: 4px;
    }

    .btn-route:hover {
      background: rgba(0, 180, 255, 0.22);
    }


    /* 새 맛집 추가 폼 */
    .add-form {
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 8px 10px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
    }

    .add-form-row {
      display: flex;
      gap: 6px;
    }

    .add-form label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .add-form input,
    .add-form select,
    .add-form textarea {
      width: 100%;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.6);
      color: #f8f8ff;
      font-size: 11px;
      resize: vertical;
    }

    .add-form textarea {
      min-height: 40px;
      max-height: 80px;
    }

    .add-form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .edit-indicator {
      font-size: 10px;
      color: #ffb3b3;
      opacity: 0.9;
    }

    .add-form button {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #ff4b4b;
      color: #fff;
    }

    .add-form button:hover {
      opacity: 0.9;
    }

    @media (min-width: 768px) {
      main {
        flex-direction: row;
        height: calc(100vh - 60px);
      }

      #map {
        flex: 2;
      }

      .right-panel {
        flex: 1;
        max-height: none;
        border-top: none;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>tastyboardgameclub</h1>
    <span>보드게임 모임의 맛집 아카이브</span>
  </header>

  <main>
    <!-- 지도 -->
    <div id="map"></div>

    <!-- 오른쪽 패널 -->
    <div class="right-panel">
      <!-- 카테고리 필터 -->
      <div>
        <div class="section-title">카테고리</div>
        <div class="chip-row" id="categoryRow">
          <button class="chip active" data-category="all">전체</button>
          <button class="chip" data-category="kimchi">김치찌개</button>
          <button class="chip" data-category="gukbap">국밥</button>
          <button class="chip" data-category="michelin">미쉐린</button>
          <button class="chip" data-category="korean">한식</button>
          <button class="chip" data-category="chinese">중식</button>
          <button class="chip" data-category="japanese">일식</button>
          <button class="chip" data-category="western">양식</button>
          <button class="chip" data-category="snacks">분식</button>
          <button class="chip" data-category="brunch">브런치</button>
          <button class="chip" data-category="cafe">카페</button>
          <button class="chip" data-category="etc">기타</button>
        </div>
      </div>

      <!-- 키워드 / 기본맛 필터 -->
      <div>
        <div class="section-title">키워드 / 기본맛</div>
        <div class="chip-row" id="tagRow">
          <button class="chip" data-tag="rich">진한맛</button>
          <button class="chip" data-tag="fresh">시원한맛</button>
          <button class="chip" data-tag="spicy">매운맛</button>
          <button class="chip" data-tag="mild">맵지않음</button>
          <button class="chip" data-tag="sweet">달달함</button>
          <button class="chip" data-tag="clean">담백함</button>
        </div>
      </div>

      <!-- 새 맛집 추가 / 수정 폼 -->
      <div>
        <div class="section-title">
          <span>새 맛집 추가 / 수정</span>
          <span style="font-size:10px; opacity:.65;"></span>
        </div>
        <form class="add-form" id="addForm">
          <div class="add-form-row">
            <label>
              가게 이름
              <input type="text" id="inputName" required />
            </label>
          </div>
          <div class="add-form-row">
            <label>
              카테고리
              <select id="inputCategory">
                <option value="kimchi">김치찌개</option>
                <option value="gukbap">국밥</option>
                <option value="michelin">미쉐린</option>
                <option value="korean">한식</option>
                <option value="chinese">중식</option>
                <option value="japanese">일식</option>
                <option value="western">양식</option>
                <option value="snacks">분식</option>
                <option value="brunch">브런치</option>
                <option value="cafe">카페</option>
                <option value="etc">기타</option>
              </select>
            </label>
            <label>
              메뉴
              <input type="text" id="inputMenu" placeholder="예: 김치찌개, 국밥" />
            </label>
          </div>
          <div class="add-form-row">
            <label>
              기본맛
              <select id="inputBaseFlavor">
                <option value="">선택 안 함</option>
                <option value="rich">진한맛</option>
                <option value="fresh">시원한맛</option>
                <option value="spicy">매운맛</option>
                <option value="mild">맵지않음</option>
                <option value="sweet">달달함</option>
                <option value="clean">담백함</option>
              </select>
            </label>
            <label>
              별점(1~5)
              <input type="number" id="inputRating" min="1" max="5" step="0.1" value="4.0" />
            </label>
          </div>
          <label>
            주소
            <input type="text" id="inputAddress" placeholder="예: 서울 중구 을지로 12" />
          </label>
          <label>
            메모
            <textarea id="inputMemo" placeholder="분위기, 누가 같이 갔는지 등"></textarea>
          </label>
          <label>
            태그 (쉼표로 구분, 예: 얼큰, 혼밥가능)
            <input type="text" id="inputTags" />
          </label>
          <div class="add-form-footer">
            <span class="edit-indicator" id="editIndicator" style="visibility:hidden;">
              ✏️ 수정 모드: 저장하면 이 항목이 변경됩니다
            </span>
            <button type="submit" id="submitButton">추가하기</button>
          </div>
        </form>
      </div>

      <!-- 맛집 리스트 -->
      <div>
        <div class="section-title">맛집 리스트</div>
        <div class="place-list" id="placeList"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔹 Firebase 초기화
    const firebaseConfig = {
      apiKey: "AIzaSyArR8iVelWNvFsr0aa6sw2oydAucE5RyYY",
      authDomain: "tastyboardgameclub.firebaseapp.com",
      projectId: "tastyboardgameclub",
      storageBucket: "tastyboardgameclub.firebasestorage.app",
      messagingSenderId: "476106967254",
      appId: "1:476106967254:web:827b96f6e2003b1a992177",
      measurementId: "G-PLME6B0KT0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 기본 샘플 데이터 (DB 비어 있을 때만 한 번 채우기용)
    const defaultPlaces = [
      {
        name: "을지로 김치찌개집 A",
        category: "kimchi",
        menu: "김치찌개",
        baseFlavor: "진한맛",
        rating: 4.8,
        memo: "국물 리필 계속하게 됨. 밥 비벼 먹기 최고. 술 한잔 곁들이기 좋음.",
        tags: ["얼큰", "직장인많음"],
        address: "서울 중구 을지로 근처",
        lat: null,
        lng: null
      },
      {
        name: "성수 김치찌개집 C",
        category: "kimchi",
        menu: "김치찌개",
        baseFlavor: "시원한맛",
        rating: 4.2,
        memo: "매운 거 잘 못 먹는 사람도 안전한 김치찌개. 반찬 푸짐.",
        tags: ["mild", "가족모임", "밥많이"],
        address: "서울 성동구 성수동 일대",
        lat: null,
        lng: null
      },
      {
        name: "홍대 돈까스집 B",
        category: "porkcutlet",
        menu: "등심 돈까스",
        baseFlavor: "달달함",
        rating: 4.3,
        memo: "겉은 바삭, 속은 촉촉. 혼밥 자리 많고 소스 맛이 묘하게 중독적.",
        tags: ["혼밥가능", "돈까스"],
        address: "서울 마포구 홍대 인근",
        lat: null,
        lng: null
      }
    ];

    let places = []; // { id, name, ... }
    let currentCategory = "all";
    let currentTag = null;

    const categoryRow = document.getElementById("categoryRow");
    const tagRow = document.getElementById("tagRow");
    const placeListEl = document.getElementById("placeList");
    const addForm = document.getElementById("addForm");
    const submitButton = document.getElementById("submitButton");
    const editIndicator = document.getElementById("editIndicator");

    let map = null;
    let markers = [];
    let infoWindow = null;
    let editingId = null; // null이면 추가, 문자열이면 해당 doc 수정

    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating - full >= 0.5;
      const empty = 5 - full - (half ? 1 : 0);

      return "★".repeat(full) +
        (half ? "☆" : "") +
        "·".repeat(empty);
    }

    function categoryLabel(cat) {
      switch (cat) {
        case "kimchi": return "김치찌개";
        case "gukbap": return "국밥";
        case "michelin": return "미쉐린";
        case "korean": return "한식";
        case "chinese": return "중식";
        case "japanese": return "일식";
        case "western": return "양식";
        case "snacks": return "분식";
        case "brunch": return "브런치";
        case "cafe": return "카페";
        case "etc": return "기타";
        default: return cat;
      }
    }

    function flavorLabel(flavor) {
      const map = {
        "spicy": "매운맛",
        "mild": "맵지않음",
        "sweet": "달달함",
        "clean": "담백함",
        "rich": "진한맛",
        "fresh": "시원한맛"
      };
      return map[flavor] || flavor; // 매핑 없으면 원래 글자 그대로
    }


    // 🔹 카테고리별 색상 (리스트 왼쪽 라인용)
    function categoryColor(cat) {
      switch (cat) {
        case "kimchi": return "#ff6b6b";
        case "gukbap": return "#c28b4e";
        case "michelin": return "#ffd700";
        case "korean": return "#ff8a3d";
        case "chinese": return "#e53935";
        case "japanese": return "#ff7eb3";
        case "western": return "#42a5f5";
        case "snacks": return "#ff9800";
        case "brunch": return "#f4b400";
        case "cafe": return "#4caf50";
        case "etc": return "#9e9e9e";
        default: return "rgba(255,255,255,0.18)";
      }
    }


    function isVisiblePlace(p) {
      if (currentCategory !== "all" && p.category !== currentCategory) return false;
      if (currentTag) {
        const inTags = p.tags && p.tags.some(t => t.includes(currentTag));
        const inBaseFlavor = p.baseFlavor && p.baseFlavor.includes(currentTag);
        if (!inTags && !inBaseFlavor) return false;
      }
      return true;
    }

    function renderPlaceList() {
      const parts = [];

      places.forEach((p, idx) => {
        if (!isVisiblePlace(p)) return;
        const color = categoryColor(p.category);

        parts.push(`
        <div class="place-item" data-idx="${idx}" style="border-left-color:${color};">
          <div class="place-header-row">
            <div>
              <div class="place-name">${p.name}</div>
              <div class="place-menu">${categoryLabel(p.category)} · ${p.menu || ""}</div>
            </div>
            <div class="place-rating">${renderStars(p.rating)} (${Number(p.rating || 0).toFixed(1)})</div>
          </div>
          ${p.baseFlavor
            ? `<div class="flavor-detail">
                  기본맛: ${flavorLabel(p.baseFlavor)}
                </div>`
            : ""
          }
          <div class="place-tags">
            ${(p.tags || []).map(tag => `#${tag}`).join(" ")}
          </div>
          <div class="place-memo">${p.memo || ""}</div>
          <div class="place-actions">
            <button type="button" class="btn-edit">수정</button>
            <button type="button" class="btn-delete btn-delete">삭제</button>
            <button type="button" class="btn-route" onclick="openNaverRoute(${idx})">길찾기</button>
          </div>
        </div>
      `);
      });

      if (!parts.length) {
        placeListEl.innerHTML = `<div style="font-size:12px; opacity:.7; padding:6px 2px;">
          조건에 맞는 맛집이 아직 없어요. 나중에 추가 예정!
        </div>`;
      } else {
        placeListEl.innerHTML = parts.join("");
      }
    }

    function refreshMarkers() {
      if (!map) return;
      markers.forEach(m => m.setMap(null));
      markers = [];

      places.forEach((p, idx) => {
        if (p.lat == null || p.lng == null) return;
        const pos = new naver.maps.LatLng(p.lat, p.lng);

        const marker = new naver.maps.Marker({
          position: pos,
          map: map,
          title: p.name
        });

        // 🔹 마커 클릭하면 가게 이름 띄우기 + 리스트 하이라이트
        naver.maps.Event.addListener(marker, "click", function () {
          // 지도 중앙으로 이동
          map.panTo(pos);

          // infoWindow 없으면 생성
          if (!infoWindow) {
            infoWindow = new naver.maps.InfoWindow({
              anchorSkew: true
            });
          }

          // 말풍선에 가게 이름 출력
          infoWindow.setContent(
            `<div style="padding:4px 8px;font-size:12px;color:#000;">${p.name}</div>`
          );
          infoWindow.open(map, marker);

          // 오른쪽 리스트에서 해당 가게 항목 찾기
          const item = document.querySelector(`.place-item[data-idx="${idx}"]`);
          if (item) {
            item.scrollIntoView({ behavior: "smooth", block: "center" });
            item.classList.add("active-place");
            setTimeout(() => item.classList.remove("active-place"), 800);
          }
        });

        markers.push(marker);
      });
    }


    // 네이버 geocoder 사용
    function geocodeAddress(address) {
      return new Promise((resolve, reject) => {
        if (!address) {
          resolve(null);
          return;
        }

        naver.maps.Service.geocode(
          { query: address },
          function (status, response) {
            if (status !== naver.maps.Service.Status.OK) {
              console.error("geocode error:", status, response);
              reject(new Error("지오코딩 실패"));
              return;
            }

            const result = response.v2.addresses[0];
            if (!result) {
              resolve(null);
              return;
            }

            const lat = parseFloat(result.y); // 위도
            const lng = parseFloat(result.x); // 경도

            resolve({ lat, lng });
          }
        );
      });
    }

    // 카테고리 버튼
    categoryRow.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      [...categoryRow.children].forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentCategory = chip.dataset.category;
      renderPlaceList();
    });

    // 태그 버튼
    tagRow.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      const tag = chip.dataset.tag;
      if (currentTag === tag) {
        currentTag = null;
        chip.classList.remove("active");
      } else {
        currentTag = tag;
        [...tagRow.children].forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
      }
      renderPlaceList();
    });

    function resetFormUI() {
      addForm.reset();
      document.getElementById("inputRating").value = "4.0";
      submitButton.textContent = "추가하기";
      editIndicator.style.visibility = "hidden";
      editingId = null;
    }

    // 리스트 클릭 (수정 / 삭제 / 지도 이동)
    placeListEl.addEventListener("click", async (e) => {
      const item = e.target.closest(".place-item");
      if (!item) return;
      const idx = Number(item.dataset.idx);
      const place = places[idx];
      if (!place) return;

      // 수정
      if (e.target.classList.contains("btn-edit")) {
        document.getElementById("inputName").value = place.name || "";
        document.getElementById("inputCategory").value = place.category || "kimchi";
        document.getElementById("inputMenu").value = place.menu || "";
        document.getElementById("inputBaseFlavor").value = place.baseFlavor || "";
        document.getElementById("inputRating").value = place.rating || 4.0;
        document.getElementById("inputAddress").value = place.address || "";
        document.getElementById("inputMemo").value = place.memo || "";
        document.getElementById("inputTags").value = (place.tags || []).join(", ");

        editingId = place.id;
        submitButton.textContent = "수정 저장";
        editIndicator.style.visibility = "visible";
        return;
      }

      // 삭제
      if (e.target.classList.contains("btn-delete")) {
        const ok = confirm(`"${place.name}" 맛집을 삭제할까요?`);
        if (!ok) return;
        try {
          await db.collection("places").doc(place.id).delete();
          if (editingId === place.id) {
            resetFormUI();
          }
        } catch (err) {
          console.error(err);
          alert("삭제 중 오류가 발생했어.");
        }
        return;
      }

      // 단순 클릭 → 지도 이동
      if (!map || place.lat == null || place.lng == null) {
        alert("이 맛집은 아직 좌표 정보가 없어요. 주소를 입력해서 업데이트해줘!");
        return;
      }
      const pos = new naver.maps.LatLng(place.lat, place.lng);
      map.panTo(pos);

      if (!infoWindow) {
        infoWindow = new naver.maps.InfoWindow({
          anchorSkew: true
        });
      }
      infoWindow.setContent(
        `<div style="padding:4px 8px;font-size:12px;color:#000;">${place.name}</div>`
      );
      infoWindow.open(map, pos);
    });

    // 추가 / 수정 submit
    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("inputName").value.trim();
      const category = document.getElementById("inputCategory").value;
      const menu = document.getElementById("inputMenu").value.trim();
      const baseFlavor = document.getElementById("inputBaseFlavor").value;
      const rating = parseFloat(document.getElementById("inputRating").value) || 0;
      const memo = document.getElementById("inputMemo").value.trim();
      const tagsRaw = document.getElementById("inputTags").value.trim();
      const address = document.getElementById("inputAddress").value.trim();

      if (!name) {
        alert("가게 이름은 꼭 적어줘!");
        return;
      }

      const tags = tagsRaw
        ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean)
        : [];

      try {
        if (!editingId) {
          // 새로 추가
          let lat = null;
          let lng = null;
          try {
            if (address) {
              const result = await geocodeAddress(address);
              if (result) {
                lat = result.lat;
                lng = result.lng;
              } else {
                alert("주소로 위치를 찾지 못했어. 좌표 없이 리스트에만 추가할게!");
              }
            }
          } catch (err) {
            console.error(err);
            alert("주소 검색 중 오류가 났어. 그래도 맛집은 리스트에 추가할게!");
          }

          await db.collection("places").add({
            name,
            category,
            menu,
            baseFlavor,
            rating,
            memo,
            tags,
            address,
            lat,
            lng,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          // 기존 항목 수정
          const target = places.find(p => p.id === editingId);
          if (!target) {
            alert("수정하려던 항목을 찾을 수 없어요. 리스트를 새로고침해볼까?");
            resetFormUI();
            return;
          }

          let newLat = target.lat;
          let newLng = target.lng;

          try {
            if (address && address !== (target.address || "")) {
              const result = await geocodeAddress(address);
              if (result) {
                newLat = result.lat;
                newLng = result.lng;
              } else {
                alert("새 주소로 위치를 찾지 못했어. 기존 좌표를 유지할게!");
              }
            }
          } catch (err) {
            console.error(err);
            alert("주소 검색 중 오류가 났어. 기존 좌표를 유지할게!");
          }

          await db.collection("places").doc(editingId).update({
            name,
            category,
            menu,
            baseFlavor,
            rating,
            memo,
            tags,
            address,
            lat: newLat,
            lng: newLng
          });
        }

        resetFormUI();
      } catch (err) {
        console.error(err);
        alert("저장 중 오류가 발생했어.");
      }
    });

    // Firestore 실시간 구독 + 초기 샘플 시딩
    let initialLoaded = false;

    db.collection("places").orderBy("createdAt", "asc").onSnapshot(async (snapshot) => {
      if (!initialLoaded && snapshot.empty) {
        // 첫 로딩이고, DB가 완전히 비어 있으면 샘플 데이터 한 번 넣어줌
        const batch = db.batch();
        defaultPlaces.forEach(p => {
          const ref = db.collection("places").doc();
          batch.set(ref, {
            ...p,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
        initialLoaded = true;
        await batch.commit();
        return;
      }

      initialLoaded = true;
      places = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));

      renderPlaceList();
      refreshMarkers();
    });

    // 네이버 지도 초기화
    function initMap() {
      const center = new naver.maps.LatLng(37.5665, 126.9780);
      map = new naver.maps.Map('map', {
        center,
        zoom: 13
      });
      refreshMarkers();
    }

    window.navermap_authFailure = function () {
      console.error("네이버 지도 인증 실패! ncpKeyId나 도메인 설정을 다시 확인해줘.");
    };

    initMap();

    function openNaverRoute(idx) {
      const p = places[idx];
      if (!p || p.lat == null || p.lng == null) {
        alert("이 맛집은 아직 좌표 정보가 없어요. 주소를 입력해서 저장해줘!");
        return;
      }

      const dlat = p.lat;
      const dlng = p.lng;
      const dname = encodeURIComponent(p.name);
      const appname = encodeURIComponent(location.origin || "https://leedly125.github.io");
      const ua = navigator.userAgent || "";

      // 📱 ANDROID → intent 스킴 (네이버 지도 앱)
      if (/Android/i.test(ua)) {
        const intentUrl =
          `intent://route/public?dlat=${dlat}&dlng=${dlng}&dname=${dname}&appname=${appname}` +
          `#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end`;
        location.href = intentUrl;
        return;
      }

      // 🍎 iOS (iPhone/iPad) → nmap 스킴
      if (/iPhone|iPad|iPod/i.test(ua)) {
        const nmapUrl =
          `nmap://route/public?dlat=${dlat}&dlng=${dlng}&dname=${dname}&appname=${appname}`;
        location.href = nmapUrl;
        return;
      }

      // 💻 데스크톱 → 네이버 지도 웹으로 열기 (새 탭)
      const webUrl =
        `https://map.naver.com/v5/search/${dname}?c=${dlng},${dlat},16,0,0,0,dh`;
      window.open(webUrl, "_blank");
    }
  </script>
</body>
